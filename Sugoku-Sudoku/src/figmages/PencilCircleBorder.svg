<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 20 20">
  <defs>
    <filter id="pencil-circle" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.55" numOctaves="2" seed="7" result="grain"/>
      <feDisplacementMap in="SourceGraphic" in2="grain" scale="0.8" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
  </defs>
  <g filter="url(#pencil-circle)" stroke-linecap="round" stroke-linejoin="round">
    <circle cx="10" cy="10" r="7.4" fill="none" stroke="#171614" stroke-width="3.4"/>
    <circle cx="10" cy="10" r="7.1" fill="none" stroke="#302d29" stroke-opacity="0.8" stroke-width="1.2"/>
  </g>
</svg>
